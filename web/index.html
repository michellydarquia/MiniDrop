<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniDrop</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="container">

        <section class="computador-local">
            <div>
                <span class="legenda">ESTE COMPUTADOR</span>
                <h2>Computador A</h2>
                <p>UDP 5000 • TCP 5001 • HTTP 8080</p>
            </div>
        </section>


        <div class="conteudo">

            <section class="card">

                <div class="titulo-card">
                    <div>
                        <h2>Selecionar destino</h2>
                        <p>Dispositivos MiniDrop encontrados na rede.</p>
                    </div>

                    <button id="buscar" class="botao-secundario">
                        Atualizar
                    </button>
                </div>


                <div id="dispositivos" class="dispositivos">

                    <div class="vazio">
                        Clique em atualizar para buscar dispositivos.
                    </div>

                </div>

            </section>


            <section class="card">

                <h2>Selecionar arquivo</h2>
                <p>Escolha o arquivo que deseja enviar.</p>


                <label class="area-arquivo">

                    <div class="icone-upload">
                        ↑
                    </div>

                    <strong>Escolher arquivo</strong>

                    <span id="nome-arquivo">
                        Nenhum arquivo selecionado
                    </span>

                    <input type="file" id="arquivo">

                </label>


                <button id="enviar" class="botao-enviar" disabled>
                    Enviar arquivo
                </button>

            </section>

        </div>


        <div id="status" class="status">
            Pronto.
        </div>

    </main>

    <script src="/app.js"></script>

</body>

</html>
